android.injected.testOnly=false
android.useAndroidX=true
kotlin.code.style=official
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true

# https://developer.android.com/studio/build/optimize-your-build#use-non-transitive-r-classes
android.nonTransitiveRClass=true
# https://blog.jetbrains.com/kotlin/2022/07/a-new-approach-to-incremental-compilation-in-kotlin/
kotlin.incremental.useClasspathSnapshot=true
# https://docs.gradle.org/7.5/userguide/configuration_cache.html
org.gradle.unsafe.configuration-cache=true
android.nonFinalResIds=false
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Workaround for google/ksp#1079 and bumptech/glide#5500.
# KSP2 records file paths relative to the project dir. On Windows there is no
# relative path across drive letters, so Glide's KSP indexer fails while resolving
# okhttp3-integration out of the Gradle cache on another drive:
# "this and base files have different roots: C:\Users\<user>\.gradle\caches\...\okhttp3-integration-*.jar! and D:\GitHub\music\app".
# Fall back to the KSP1 task until KSP2 stops throwing on cross-drive setups.
# Remove this once the Gradle user home lives on the same drive as the project.
ksp.useKSP2=false
